id: org.freedesktop.Sdk.Extension.openjdk8
branch: '24.08'
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false

cleanup:
  - /share/info
  - /share/man

build-options:
  no-debuginfo: true
  strip: true
  prefix: /usr/lib/sdk/openjdk8
  env:
    V: '1'

modules:
  # Boot JDK requirements: https://htmlpreview.github.io/?https://raw.githubusercontent.com/openjdk/jdk/master/doc/building.html#boot-jdk-requirements
  - name: bootstrap-java
    cleanup:
      - '*'
    buildsystem: simple
    sources:
      - type: archive
        dest: bootstrap-java
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u472-b08/OpenJDK8U-jdk_aarch64_linux_hotspot_8u472b08.tar.gz
        dest-filename: java-openjdk.tar.gz
        sha256: e2aff19d85d2441e409d6cbdf12ef7c2acabb0de73bca4207947135dcaa935a2
      - type: archive
        dest: bootstrap-java
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u472-b08/OpenJDK8U-jdk_x64_linux_hotspot_8u472b08.tar.gz
        dest-filename: java-openjdk.tar.gz
        sha256: 5becaa4ac660e844c5a39e2ebc39ff5ac824c37ff1b625af8c8b111dc13c3592
    build-commands:
      - mv bootstrap-java $FLATPAK_DEST/

  - name: java
    buildsystem: autotools
    no-parallel-make: true
    config-opts:
      - --with-boot-jdk=/usr/lib/sdk/openjdk8/bootstrap-java
      - --with-jvm-variants=server
      - --with-debug-level=release
      - --with-native-debug-symbols=internal
      - --enable-unlimited-crypto
      - --with-zlib=system
      - --with-giflib=system
      - --with-extra-cxxflags=-O2 -g -Wno-error -std=gnu++98 -fno-delete-null-pointer-checks -fno-lifetime-dse -fcommon
      - --with-extra-cflags=-O2 -g -fstack-protector-strong -Wno-error -fno-delete-null-pointer-checks -fno-lifetime-dse -fcommon
      - --with-extra-ldflags=-Wl,-z,relro -Wl,-z,now
      - --with-milestone=fcs
    make-args:
      - JAVAC_FLAGS=-g
      - LOG=trace
      - WARNINGS_ARE_ERRORS=-Wno-error
      - CFLAGS_WARNINGS_ARE_ERRORS=-Wno-error
      - images
    sources:
      - type: git
        url: https://github.com/adoptium/jdk8u.git
        tag: jdk8u482-b08
        commit: cea3cd4c1d7aa70e998d45ca2e419793a550321e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/adoptium/temurin8-binaries/releases/latest
          is-main-source: true
          tag-query: .tag_name
      - type: patch
        paths:
          - patches/0001-Fix-Wint-conversion.patch
          - patches/0002-Fix-Wincompatible-pointer-types.patch
          - patches/0003-ConfigureNotify-behavior-has-changed-in-KWin-6.2.patch
      - type: shell
        commands:
          - chmod a+x configure
          - git describe --match "jdk8u*-b*" HEAD | sed -e 's/jdk8u[[:digit:]]\+-\(b[[:digit:]]\+\)/JDK_BUILD_NUMBER=\1/' >> common/autoconf/version-numbers

  # Java version requirements for Maven: https://maven.apache.org/docs/history.html
  - name: maven
    buildsystem: simple
    cleanup:
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: 0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          is-main-source: false
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
          versions:
            <: 4.0.0
    build-commands:
      - mkdir -p $FLATPAK_DEST/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jansi-native --directory=$FLATPAK_DEST/maven
      - ln -s $FLATPAK_DEST/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin

  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - mkdir -p /app/jre
          - cd /usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - cp -ra * /app/jre
          - rm -rf /app/jre/src.zip /app/jre/include /app/jre/demo /app/jre/sample
        dest-filename: install.sh
      - type: script
        commands:
          - mkdir -p /app/jdk
          - cd /usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - cp -ra * /app/jdk
        dest-filename: installjdk.sh
      - type: script
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - export PATH=$PATH:/usr/lib/sdk/openjdk8/bin
        dest-filename: enable.sh
    build-commands:
      - (cd /usr/lib/sdk/openjdk8/jvm && ln -s openjdk-1.8.0* java-8-openjdk)
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk8/

  - name: appdata
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/appdata
      - cp org.freedesktop.Sdk.Extension.openjdk8.appdata.xml ${FLATPAK_DEST}/share/appdata
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk8.appdata.xml
