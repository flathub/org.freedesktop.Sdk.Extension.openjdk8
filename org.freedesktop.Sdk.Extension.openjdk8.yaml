id: org.freedesktop.Sdk.Extension.openjdk8
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false
cleanup:
  - /share/info
  - /share/man
build-options:
  no-debuginfo: true
  strip: true
  prefix: /usr/lib/sdk/openjdk8
  env:
    V: '1'
modules:
  - name: bootstrap-java
    cleanup:
      - '*'
    buildsystem: simple
    sources:
      - type: archive
        dest: bootstrap-java
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u462-b08/OpenJDK8U-jdk_aarch64_linux_hotspot_8u462b08.tar.gz
        dest-filename: java-openjdk.tar.gz
        sha256: 19552c1cf7f5c18290a6bdcd6757f70ea5c331a2bc0dd7a3b3120e8dbc4b4891
        x-checker-data:
          type: json
          url: https://api.github.com/repos/adoptium/temurin8-binaries/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name | startswith("OpenJDK8U-jdk_aarch64_linux_hotspot_") and endswith(".tar.gz")).browser_download_url
      - type: archive
        dest: bootstrap-java
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u462-b08/OpenJDK8U-jdk_x64_linux_hotspot_8u462b08.tar.gz
        dest-filename: java-openjdk.tar.gz
        sha256: 5d64ae542b59a962b3caadadd346f4b1c3010879a28bb02d928326993de16e79
        x-checker-data:
          type: json
          url: https://api.github.com/repos/adoptium/temurin8-binaries/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name | startswith("OpenJDK8U-jdk_x64_linux_hotspot_") and endswith(".tar.gz")).browser_download_url
    build-commands:
      - mv bootstrap-java $FLATPAK_DEST/
  - name: java
    buildsystem: autotools
    no-parallel-make: true
    config-opts:
      - --with-boot-jdk=/usr/lib/sdk/openjdk8/bootstrap-java
      - --with-jvm-variants=server
      - --with-debug-level=release
      - --with-native-debug-symbols=internal
      - --enable-unlimited-crypto
      - --with-zlib=system
      - --with-giflib=system
      - --with-extra-cxxflags=-O2 -g -Wno-error -std=gnu++98 -fno-delete-null-pointer-checks -fno-lifetime-dse -fcommon
      - --with-extra-cflags=-O2 -g -std=gnu99 -fstack-protector-strong -Wno-error -fno-delete-null-pointer-checks -fno-lifetime-dse -fcommon
      - --with-extra-ldflags=-Wl,-z,relro -Wl,-z,now
      - --with-milestone=fcs
    make-args:
      - JAVAC_FLAGS=-g
      - LOG=trace
      - WARNINGS_ARE_ERRORS=-Wno-error
      - CFLAGS_WARNINGS_ARE_ERRORS=-Wno-error
      - images
    sources:
      - type: git
        url: https://github.com/adoptium/jdk8u.git
        tag: jdk8u462-b08
        commit: 943a5ea328fd2fc8eed0aed4ec9b1957d41f8144
        x-checker-data:
          type: json
          url: https://api.github.com/repos/adoptium/temurin8-binaries/releases/latest
          is-main-source: true
          tag-query: .tag_name
      - type: patch
        paths:
          - patches/0001-Fix-Wint-conversion.patch
          - patches/0002-Fix-Wincompatible-pointer-types.patch
          - patches/0003-ConfigureNotify-behavior-has-changed-in-KWin-6.2.patch
          - patches/0004-Build-failure-with-glibc-2.42-due-to-uabs-name.patch
      - type: shell
        commands:
          - chmod a+x configure
          - git describe --match "jdk8u*-b*" HEAD | sed -e 's/jdk8u[[:digit:]]\+-\(b[[:digit:]]\+\)/JDK_BUILD_NUMBER=\1/' >> common/autoconf/version-numbers
  - name: maven
    buildsystem: simple
    cleanup:
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          is-main-source: false
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
          versions:
            <: 4.0.0
    build-commands:
      - mkdir -p $FLATPAK_DEST/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jansi-native --directory=$FLATPAK_DEST/maven
      - ln -s $FLATPAK_DEST/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin
  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - mkdir -p /app/jre
          - cd /usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - cp -ra * /app/jre
          - rm -rf /app/jre/src.zip /app/jre/include /app/jre/demo /app/jre/sample
        dest-filename: install.sh
      - type: script
        commands:
          - mkdir -p /app/jdk
          - cd /usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - cp -ra * /app/jdk
        dest-filename: installjdk.sh
      - type: script
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk8/jvm/java-8-openjdk
          - export PATH=$PATH:/usr/lib/sdk/openjdk8/bin
        dest-filename: enable.sh
    build-commands:
      - (cd /usr/lib/sdk/openjdk8/jvm && ln -s openjdk-1.8.0* java-8-openjdk)
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk8/
  - name: appdata
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/appdata
      - cp org.freedesktop.Sdk.Extension.openjdk8.appdata.xml ${FLATPAK_DEST}/share/appdata
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk8.appdata.xml
